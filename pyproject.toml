[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "causalode"
version = "0.1.0"
description = "Causal gene regulatory network inference from Perturb-seq with a coupled RNA / regulator-activity ODE, and the causal reach (CRV) score"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "torch>=2.0",
    "anndata>=0.8",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
causalode = "causalode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
